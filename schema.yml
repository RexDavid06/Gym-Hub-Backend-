  /api/membership-payments/:
    get:
      operationId: membership_payments_list
      description: Base viewset for tenant-owned models; subclasses inherit gym filtering.
      parameters:
      - in: query
        name: member
        schema:
          type: integer
      - in: query
        name: subscription
        schema:
          type: integer
      tags:
      - membership-payments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembershipPayment'
          description: ''
    post:
      operationId: membership_payments_create
      description: Base viewset for tenant-owned models; subclasses inherit gym filtering.
      tags:
