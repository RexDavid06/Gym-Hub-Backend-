openapi: 3.0.3
info:
  title: Gym Management API
  version: 0.1.0
  description: Foundation API for the Gym Management SaaS.
paths:
  /api/admins/:
    get:
      operationId: admins_list
      tags:
      - admins
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserList'
          description: ''
  /api/admins/{user_id}/permissions/:
    put:
      operationId: admin_permissions_set
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admins
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffPermissionSet'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffPermissionSet'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffPermissionSet'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
          description: ''
  /api/admins/{user_id}/permissions/{code}/:
    delete:
      operationId: admin_permissions_revoke
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admins
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Revoke a refresh token so it can no longer be rotated or exchanged.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
