components:
  schemas:
    CodesEnum:
      enum:
      - manage_members
      - manage_trainers
      - manage_payments
      - assign_trainers
      - view_reports
      type: string
      description: |-
        * `manage_members` - manage_members
        * `manage_trainers` - manage_trainers
        * `manage_payments` - manage_payments
        * `assign_trainers` - assign_trainers
        * `view_reports` - view_reports
    GymSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    InviteCreate:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/InviteRoleEnum'
        phone:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 200
      required:
      - name
      - phone
      - role
    InviteCreated:
      type: object
      properties:
        id:
          type: integer
        role:
          type: string
        phone:
          type: string
        name:
          type: string
        expires_at:
          type: string
          format: date-time
        code:
          type: string
      required:
      - code
      - expires_at
      - id
      - name
      - phone
      - role
    InviteList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          $ref: '#/components/schemas/InviteRoleEnum'
        phone:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 200
