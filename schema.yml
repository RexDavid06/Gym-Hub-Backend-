openapi: 3.0.3
info:
  title: Gym Management API
  version: 0.1.0
  description: Foundation API for the Gym Management SaaS.
paths:
  /api/admins/:
    get:
      operationId: admins_list
      tags:
      - admins
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserList'
          description: ''
  /api/admins/{user_id}/permissions/:
    put:
      operationId: admin_permissions_set
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admins
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffPermissionSet'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffPermissionSet'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffPermissionSet'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
          description: ''
  /api/admins/{user_id}/permissions/{code}/:
    delete:
      operationId: admin_permissions_revoke
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admins
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/redeem-invite/:
    post:
      operationId: auth_redeem_invite_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemInvite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RedeemInvite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RedeemInvite'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemInviteResponse'
          description: ''
  /api/auth/register-gym/:
    post:
      operationId: auth_register_gym_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterGym'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterGym'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterGym'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredGym'
          description: ''
  /api/invites/:
    get:
      operationId: invites_list
      tags:
      - invites
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InviteList'
          description: ''
    post:
      operationId: invites_create
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InviteCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InviteCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCreated'
          description: ''
  /api/me/:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/me/members/:
    get:
      operationId: me_members_list
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserList'
          description: ''
  /api/me/trainer/:
    get:
      operationId: me_trainer_retrieve
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberTrainer'
          description: ''
  /api/members/{user_id}/trainer/:
    get:
      operationId: members_trainer_retrieve
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - members
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberTrainer'
          description: ''
    put:
      operationId: members_trainer_update
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainerAssignmentInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TrainerAssignmentInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TrainerAssignmentInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberTrainer'
          description: ''
    delete:
      operationId: members_trainer_destroy
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - members
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhoneToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhoneToken'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
  /api/trainers/:
    get:
      operationId: trainers_list
      tags:
      - trainers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
          description: ''
  /api/users/:
    get:
      operationId: users_list
      description: Base viewset for tenant-owned models; subclasses inherit gym filtering.
      parameters:
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - member
          - owner
          - super_admin
          - trainer
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserList'
          description: ''
  /api/users/{user_id}/deactivate/:
    post:
      operationId: users_deactivate_create
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
          description: ''
components:
  schemas:
    CodesEnum:
      enum:
      - manage_members
      - manage_trainers
      - manage_payments
      - assign_trainers
      - view_reports
      type: string
      description: |-
        * `manage_members` - manage_members
        * `manage_trainers` - manage_trainers
        * `manage_payments` - manage_payments
        * `assign_trainers` - assign_trainers
        * `view_reports` - view_reports
    GymSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    InviteCreate:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/Role264Enum'
        phone:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 200
      required:
      - name
      - phone
      - role
    InviteCreated:
      type: object
      properties:
        id:
          type: integer
        role:
          type: string
        phone:
          type: string
        name:
          type: string
        expires_at:
          type: string
          format: date-time
        code:
          type: string
      required:
      - code
      - expires_at
      - id
      - name
      - phone
      - role
    InviteList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          $ref: '#/components/schemas/Role264Enum'
        phone:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 200
        expires_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - name
      - phone
      - role
    Me:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        role:
          type: string
        gym:
          allOf:
          - $ref: '#/components/schemas/GymSummary'
          nullable: true
          readOnly: true
        permission_codes:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - gym
      - id
      - name
      - permission_codes
      - phone
      - role
    MemberTrainer:
      type: object
      properties:
        member:
          $ref: '#/components/schemas/UserSummary'
        trainer:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          nullable: true
      required:
      - member
      - trainer
    PhoneToken:
      type: object
      properties:
        phone:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - phone
    RedeemInvite:
      type: object
      properties:
        code:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - code
      - password
    RedeemInviteResponse:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
      required:
      - access
      - refresh
    RegisterGym:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 32
        password:
          type: string
          writeOnly: true
        gym_name:
          type: string
          maxLength: 200
      required:
      - gym_name
      - name
      - password
      - phone
    RegisteredGym:
      type: object
      properties:
        gym_id:
          type: integer
        user_id:
          type: integer
        role:
          type: string
      required:
      - gym_id
      - role
      - user_id
    Role264Enum:
      enum:
      - admin
      - trainer
      - member
      type: string
      description: |-
        * `admin` - Admin
        * `trainer` - Trainer
        * `member` - Member
    StaffPermissionSet:
      type: object
      properties:
        codes:
          type: array
          items:
            $ref: '#/components/schemas/CodesEnum'
      required:
      - codes
    TokenPair:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
      required:
      - refresh
    TokenRefreshResponse:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    TrainerAssignmentInput:
      type: object
      properties:
        trainer_id:
          type: integer
          nullable: true
      required:
      - trainer_id
    UserList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 32
        role:
          $ref: '#/components/schemas/UserListRoleEnum'
        gym:
          type: integer
          nullable: true
        is_active:
          type: boolean
        date_joined:
          type: string
          format: date-time
          readOnly: true
        permission_codes:
          type: array
          items:
            type: string
          readOnly: true
        assigned_trainer:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          nullable: true
          readOnly: true
      required:
      - assigned_trainer
      - date_joined
      - id
      - permission_codes
      - phone
    UserListRoleEnum:
      enum:
      - super_admin
      - owner
      - admin
      - trainer
      - member
      type: string
      description: |-
        * `super_admin` - Super admin
        * `owner` - Owner
        * `admin` - Admin
        * `trainer` - Trainer
        * `member` - Member
    UserSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 32
      required:
      - id
      - phone
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
