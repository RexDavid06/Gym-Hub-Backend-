name: Backend CI
on:
  push:
  pull_request:
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --file /tmp/schema.yml --validate
      - run: diff -u schema.yml /tmp/schema.yml
      - name: Validate the Render blueprint
        run: python -c "import yaml; yaml.safe_load(open('render.yaml'))"
      - run: pytest
      - run: ruff check .
      - run: black --check .

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api-client/package-lock.json
      - name: Shared schema matches the backend schema
        run: diff -u schema.yml api-client/schema.yml
      - run: npm ci
        working-directory: api-client
      - name: Generated types are current
        run: |
          npm run gen:api
          git diff --exit-code -- src/schema.d.ts
        working-directory: api-client
      - run: npm run typecheck
        working-directory: api-client
      - run: npm run test
        working-directory: api-client
      - run: npm run build
        working-directory: api-client
      - name: Build emits the generated schema types
        run: test -f dist/schema.d.ts
        working-directory: api-client
      - run: npm run lint
        working-directory: api-client

  redis-smoke:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
      CELERY_TASK_EAGER_PROPAGATES: "false"
      RUN_REDIS_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - run: |
          celery -A config worker -Q default,notifications -l warning --pool=solo &
          sleep 5
          pytest tests/test_phase8_redis_smoke.py -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gymhub
          POSTGRES_PASSWORD: gymhub
          POSTGRES_DB: gymhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://gymhub:gymhub@localhost:5432/gymhub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - name: Production settings and static files
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdef
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          RENDER_EXTERNAL_HOSTNAME: gym-hub-api.onrender.com
        run: |
          python manage.py check --deploy
          python manage.py collectstatic --noinput
      - run: pytest
